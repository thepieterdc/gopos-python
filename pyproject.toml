[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.23,<0.13"]

[project]
name = "gopos"
version = "1.0.0"
description = "Python bindings for gopos (https://github.com/thepieterdc/gopos)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Pieter De Clercq", email = "pieterdeclercq@outlook.com" }]
keywords = ["bindings", "gopos"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.10"
dependencies = [
    "dacite>=1.9.2",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/thepieterdc/gopos-python"
Repository = "https://github.com/thepieterdc/gopos-python"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
norecursedirs = [".git", "__pycache__", "dist"]
